<!-- Wczytanie z wyprzedzeniem: krój pisma i największe zdjęcie nad zgięciem.
     Tło sekcji ustawia JavaScript, więc bez tej podpowiedzi przeglądarka
     dowiedziałaby się o nim dopiero po wykonaniu skryptów. -->
<link rel="preload" as="font" type="font/woff" href="assets/fonts/Proxima-Nova-Reg.woff" crossorigin>
<link rel="preload" as="font" type="font/woff" href="assets/fonts/Proxima-Nova-Bold.woff" crossorigin>

<body data-page="church" data-meta="church">
<a class="skip" href="#main" data-i18n="ui.skip">Przejdź do treści</a>
<div id="site-header"></div>

<main id="main">

  <section class="page-hero" data-bg="assets/img/naglowek-kosciol.webp">
    <div class="wrap">
      <h1 data-i18n="church.h1"></h1>
    </div>
  </section>

  <!-- Akapit wprowadzający na czarnym tle ze znakiem wodnym logo, a pod nim
       hasło kościoła. Obie części siedzą w jednej sekcji z planem Koszalina
       w tle — tak samo jak na dotychczasowej stronie. -->
  <section class="section section-map section-map-srodek" data-bg="assets/img/sekcja-mapa.webp">
    <div class="wrap" data-reveal>
      <div class="panel-dark">
        <p data-i18n="church.intro"></p>
      </div>
      <div class="claim-block">
        <p class="claim" data-i18n-split="church.claim" data-outline="highlight"></p>
        <p class="claim-source" data-i18n="church.claimSource"></p>
      </div>
    </div>
  </section>

  <!-- ------------------------------- JAK ŻYJEMY / CO ROBIMY / JAK ZWYCIĘŻAMY -->
  <section class="section section-akordeon">
    <div class="wrap">
      <!-- Zdjęcie wypływa poza kontener aż do lewej krawędzi okna. -->
      <div class="split split-2-3 split-stretch">
        <div class="photo-col bleed-left" data-bg="assets/img/kosciol-2.webp" role="presentation"></div>
        <div class="accordion" data-reveal>
          <div class="accordion-item">
            <button class="accordion-btn" type="button" aria-expanded="false">
              <span class="sign" aria-hidden="true"></span><span data-i18n="church.how.q1"></span>
            </button>
            <div class="accordion-panel" hidden><p data-i18n="church.how.a1"></p></div>
          </div>
          <div class="accordion-item">
            <button class="accordion-btn" type="button" aria-expanded="false">
              <span class="sign" aria-hidden="true"></span><span data-i18n="church.how.q2"></span>
            </button>
            <div class="accordion-panel" hidden><p data-i18n="church.how.a2"></p></div>
          </div>
          <div class="accordion-item">
            <button class="accordion-btn" type="button" aria-expanded="false">
              <span class="sign" aria-hidden="true"></span><span data-i18n="church.how.q3"></span>
            </button>
            <div class="accordion-panel" hidden>
              <p data-i18n="church.how.a3a"></p>
              <p data-i18n="church.how.a3b"></p>
              <p data-i18n="church.how.a3c"></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ------------------------------------------------------------ WARTOŚCI -->
  <section class="section section-flush">
    <div class="wrap">
      <!-- Tekst po lewej, zdjęcie po prawej, w proporcji 3 : 2. -->
      <div class="split split-3-2 split-stretch">
        <div class="panel-values" data-reveal>
          <h2 data-i18n="church.values.h2"></h2>
          <!-- Słowa na przemian pełne i konturowe — tak jak na dotychczasowej stronie. -->
          <p class="values mt-2">
            <span data-i18n="church.values.v1"></span>
            <span class="outline-blue" data-i18n="church.values.v2"></span>
            <span data-i18n="church.values.v3"></span>
            <span class="outline-blue" data-i18n="church.values.v4"></span>
            <span data-i18n="church.values.v5"></span>
          </p>
        </div>
        <div class="photo-col bleed-right" data-bg="assets/img/kosciol-4.webp" role="presentation"></div>
      </div>
    </div>
  </section>

  <!-- ------------------------------------------------------------- LUDZIE -->
  <!-- Sekcja jest biała; kolor niosą poszczególne wiersze, na przemian
       jasnoszary i ciemny — dokładnie jak na dotychczasowej stronie. -->
  <section class="section section-po-wartosciach">
    <div class="wrap">

      <!-- Trzy wiersze w proporcji 1 : 2, zdjęcie zawsze po lewej, wjeżdżają
           z lewej strony (w motywie animacja „afl”). Portrety wypełniają
           kolumnę na całą wysokość wiersza. -->

      <div class="split split-1-2 split-stretch people-row" data-reveal="left">
        <div class="photo-col" data-bg="assets/img/mateusz-godawa-duze.webp" role="presentation"></div>
        <div>
          <h3 data-i18n="church.pastor.h3"></h3>
          <p class="mt-2" data-i18n="church.pastor.text"></p>
          <div class="iconrow left stack mt-2">
            <div class="iconbox" data-icon="instagram">
              <a href="https://www.instagram.com/mateuszgodawa/" target="_blank" rel="noopener"
                 data-i18n="church.pastor.instagram"></a>
            </div>
          </div>
        </div>
      </div>

      <!-- Zdjęcie zespołu jest szerokie — pokazujemy je w naturalnych
           proporcjach, bez przycinania do kolumny. -->
      <!-- W oryginale ten wiersz jest wyrównany do góry: nagłówek „Zespół
           liderów” stoi na wysokości górnej krawędzi zdjęcia, a nie pośrodku
           kolumny (pozostałe dwa wiersze są wyśrodkowane w pionie). -->
      <div class="split split-1-2 split-start mt-3 people-row dark" data-reveal="left">
        <img class="photo-plain" src="assets/img/liderzy.webp" data-asset="assets/img/liderzy.webp"
             width="832" height="654" loading="lazy" data-i18n-alt="church.leaders.h3" alt="">
        <div>
          <h3 data-i18n="church.leaders.h3"></h3>
          <p class="mt-2" data-i18n="church.leaders.text"></p>
        </div>
      </div>

      <div class="split split-1-2 split-stretch mt-3 people-row" data-reveal="left">
        <div class="photo-col" data-bg="assets/img/pawel-godawa.webp" role="presentation"></div>
        <div>
          <h3 data-i18n="church.founder.h3"></h3>
          <p class="mt-2" data-i18n="church.founder.text"></p>
          <div class="iconrow left stack mt-2" id="founder-links"></div>
        </div>
      </div>

    </div>
  </section>

</main>

<div id="site-footer"></div>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/content.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
