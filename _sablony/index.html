<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- BEZPIECZEŃSTWO: lista niżej mówi, skąd strona może wczytywać treści —
     filmy z YouTube, mapa z Google, płatności do Dotpay i PayPal. Wszystko
     inne przeglądarka odrzuci, więc nawet gdyby na stronę kiedyś trafił obcy
     kod, nie ma skąd pobrać dalszego ani gdzie wysłać danych.
     Dodajesz do serwisu zewnętrzną usługę (inne mapy, serwer formularzy,
     licznik odwiedzin)? Trzeba dopisać jej adres tutaj — inaczej przeglądarka
     ją zablokuje i usługa po prostu się nie pokaże. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; form-action 'self' https://ssl.dotpay.pl https://www.paypal.com; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://i.ytimg.com; frame-src https://www.youtube-nocookie.com https://www.openstreetmap.org; upgrade-insecure-requests">
<!-- Obcy serwis dowie się przy wyjściu tylko o domenie, z której przyszedł
     odwiedzający, a nie o konkretnej stronie. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- PORZĄDKOWANIE ADRESU: kasuje z odnośnika kody śledzące sieci
     społecznościowych i newsletterów. Patrz assets/js/start.js. -->
<script src="assets/js/start.js"></script>
<title>Kościół Woda Życia — Koszalin</title>
<meta name="description" content="Kościół Woda Życia w Koszalinie. Spotkania w każdą niedzielę o 11:00, ul. Władysława IV 147. Wpadnij do nas — tak po prostu.">
<meta name="theme-color" content="#ffffff">
<link rel="canonical" href="https://wodazycia.org/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kościół Woda Życia">
<meta property="og:locale" content="pl_PL">
<meta property="og:url" content="https://wodazycia.org/">
<meta property="og:title" content="Kościół Woda Życia — Koszalin">
<meta property="og:description" content="Kościół Woda Życia w Koszalinie. Spotkania w każdą niedzielę o 11:00, ul. Władysława IV 147. Wpadnij do nas — tak po prostu.">
<meta property="og:image" content="https://wodazycia.org/assets/img/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Kościół Woda Życia — Koszalin">
<meta name="twitter:description" content="Kościół Woda Życia w Koszalinie. Spotkania w każdą niedzielę o 11:00, ul. Władysława IV 147.">
<meta name="twitter:image" content="https://wodazycia.org/assets/img/og-image.jpg">
<link rel="alternate" hreflang="pl" href="https://wodazycia.org/">
<link rel="alternate" hreflang="x-default" href="https://wodazycia.org/">
<link rel="icon" href="assets/img/favicon.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" sizes="180x180">
<!-- Wczytanie z wyprzedzeniem: krój pisma i największe zdjęcie nad zgięciem.
     Tło sekcji ustawia JavaScript, więc bez tej podpowiedzi przeglądarka
     dowiedziałaby się o nim dopiero po wykonaniu skryptów. -->
<link rel="preload" as="font" type="font/woff" href="assets/fonts/Proxima-Nova-Reg.woff" crossorigin>
<link rel="preload" as="font" type="font/woff" href="assets/fonts/Proxima-Nova-Bold.woff" crossorigin>
<link rel="preload" as="image" href="assets/img/hero.webp" fetchpriority="high">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home" data-meta="home">
<a class="skip" href="#main" data-i18n="ui.skip">Przejdź do treści</a>
<div id="site-header"></div>

<main id="main">

  <!-- ------------------------------------------------------------- HERO -->
  <section class="hero">
    <!-- Trzy zdjęcia przenikające się w kółko — tak jak dotychczasowy slider. -->
    <div class="hero-slides" aria-hidden="true">
      <span data-bg="assets/img/hero.webp"></span>
      <span data-bg="assets/img/hero-2.webp"></span>
      <span data-bg="assets/img/koszalin.webp"></span>
    </div>
    <div class="wrap hero-inner">
      <!-- Nagłówek dla wyszukiwarek i czytników ekranu; wzrokowo ukryty,
           dokładnie jak na dotychczasowej stronie. -->
      <h1 class="sr-only" data-i18n="home.h1">Woda Życia</h1>
      <p class="hero-title" data-i18n-split="home.hero" data-outline="outline"></p>
      <a class="btn btn-primary" data-page-link="first" href="#" data-i18n="home.hero.cta"></a>
    </div>
  </section>

  <!-- ------------------------------------------------- WPADNIJ DO NAS -->
  <section class="section section-map" data-bg="assets/img/sekcja-mapa.webp">
    <div class="wrap center" data-reveal>
      <h2 data-i18n="home.visit.h2"></h2>
      <p class="lead" style="max-width:44rem;margin-inline:auto" data-i18n="home.visit.p"></p>
      <div class="iconrow mt-3" id="times"></div>
      <div class="btn-row center mt-3">
        <a class="btn btn-primary" data-page-link="contact" href="#" data-i18n="home.visit.cta"></a>
      </div>
    </div>
  </section>

  <!-- ------------------------------------------- SPOTKANIA ONLINE -->
  <section class="section section-alt">
    <div class="wrap center" data-reveal>
      <h2 data-i18n="home.online.h2"></h2>
      <div class="mt-3">
        <!-- Transmisja na żywo z kanału YouTube. Odtwarzacz wstawia się
             dopiero po kliknięciu — patrz wstawWideo() w site.js. -->
        <button class="video" data-video="live" data-poster="assets/img/yt-placeholder.webp"></button>
      </div>
      <div class="btn-row center mt-3">
        <a class="btn btn-primary" id="yt-channel" href="https://www.youtube.com/@wodazyciakoszalin/featured"
           target="_blank" rel="noopener" data-i18n="home.online.channel"></a>
        <a class="btn btn-primary" id="yt-archive" href="https://www.youtube.com/@wodazyciakoszalin/streams"
           target="_blank" rel="noopener" data-i18n="home.online.archive"></a>
      </div>
    </div>
  </section>

  <!-- ------------------------------------------------- ZAINSPIRUJ SIĘ -->
  <section class="section section-flush">
    <div class="wrap">
      <h2 class="center" data-i18n="home.inspire.h2"></h2>

      <div class="podcast mt-3" data-reveal="left">
        <div class="podcast-img" data-podcast-img="current" role="img"
             data-i18n-aria="home.inspire.currentAlt"></div>
        <div class="podcast-body">
          <p data-i18n="home.inspire.current"></p>
          <div class="services mt-2" data-podcast="current"></div>
        </div>
      </div>

      <div class="podcast light mt-3" data-reveal="left">
        <div class="podcast-img" data-podcast-img="archive" role="img"
             data-i18n-aria="home.inspire.archiveAlt"></div>
        <div class="podcast-body">
          <p data-i18n="home.inspire.archive"></p>
          <div class="services mt-2" data-podcast="archive"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ----------------------------------------------------- AKTUALNOŚCI -->
  <section class="section section-alt">
    <div class="wrap" data-reveal>
      <h2 class="center" data-i18n="home.news.h2"></h2>
      <!-- data-limit="2" — na stronie głównej pokazujemy dwie najnowsze. -->
      <div class="news-grid mt-3" id="news-grid" data-limit="2"></div>
      <div class="btn-row center mt-3">
        <a class="btn btn-primary" data-page-link="news" href="#" data-i18n="home.news.all"></a>
      </div>
    </div>
  </section>

</main>

<div id="site-footer"></div>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/content.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
